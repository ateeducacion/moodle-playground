name: Format PR 264

on:
  push:
    branches:
      - perf/10-lighter-crash-snapshots

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: perf/10-lighter-crash-snapshots

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Format changed files
        run: |
          npx @biomejs/biome check --write \
            src/runtime/crash-recovery.js \
            src/runtime/fs-persistence.js \
            src/runtime/php-loader.js \
            tests/runtime/crash-recovery-checkpoint.test.js \
            tests/runtime/fs-persistence-checkpoint.test.js

      - name: Commit formatted files
        run: |
          rm .github/workflows/format-pr264.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            .github/workflows/format-pr264.yml \
            src/runtime/crash-recovery.js \
            src/runtime/fs-persistence.js \
            src/runtime/php-loader.js \
            tests/runtime/crash-recovery-checkpoint.test.js \
            tests/runtime/fs-persistence-checkpoint.test.js
          git commit -m "style: format recovery checkpoint changes"
          git push origin HEAD:perf/10-lighter-crash-snapshots
