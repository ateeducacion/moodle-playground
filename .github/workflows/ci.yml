name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
    types: [opened, reopened, synchronize, closed]
  workflow_dispatch:
    inputs:
      reason:
        description: "Reason for manual rebuild (e.g., SQLite driver patch updated, new Moodle version)"
        required: false
        type: string

permissions:
  contents: read
  pages: write
  id-token: write
  pull-requests: write

concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  CLOUDFLARE_ACCOUNT_ID: 8cdbd0eb9712b3a9a3e9b860fd87ed6c
  CLOUDFLARE_PAGES_PROJECT: moodle-playground
  PREVIEW_BUTTON_IMG: https://raw.githubusercontent.com/ateeducacion/moodle-playground/main/assets/playground-preview-button.svg

jobs:
  # ── Build ID: generated once, reused by every job in this run ──
  # A pipeline run produces exactly one Build ID (YYYYMMDDTHHMMSSZ-<sha8>), so
  # the artifact tested by e2e is the one deployed to Pages and Cloudflare.
  # See docs/architecture/adr/ADR-0029-build-identification-and-cache-versioning.md
  build-id:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    outputs:
      build_version: ${{ steps.meta.outputs.build_version }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Compute Build ID
        id: meta
        env:
          # On pull_request, actions/checkout resolves a throwaway merge commit;
          # record the PR head commit so the Build ID stays traceable to source.
          BUILD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          build_version="$(node scripts/write-build-version.mjs --print-version)"
          echo "build_version=$build_version" >> "$GITHUB_OUTPUT"
          echo "Build ID: $build_version" >> "$GITHUB_STEP_SUMMARY"

  # ── Fast feedback: syntax + unit tests + lint (no PHP, no bundle) ──
  lint-and-test:
    if: github.event.action != 'closed'
    needs: build-id
    runs-on: ubuntu-latest
    env:
      BUILD_VERSION: ${{ needs.build-id.outputs.build_version }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Generate build metadata
        run: npm run build:version

      - name: Syntax check
        run: |
          node --check sw.js
          node --check php-worker.js
          node --check lib/moodle-loader.js
          node --check lib/streaming-tar-extract.js
          node --check src/runtime/bootstrap.js
          node --check src/runtime/php-loader.js
          node --check src/runtime/php-compat.js
          node --check src/runtime/crash-recovery.js
          node --check src/shell/main.js
          node --check src/remote/main.js
          node --check src/blueprint/index.js
          node --check scripts/lib/tar-ustar.mjs

      - name: Run unit tests
        run: make test

      - name: Lint
        run: make lint

  # ── Build: all 6 Moodle branches + docs ──
  build:
    if: github.event.action != 'closed'
    needs: build-id
    runs-on: ubuntu-latest
    env:
      BUILD_VERSION: ${{ needs.build-id.outputs.build_version }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/configure-pages@v6
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          tools: composer

      - name: Install dependencies
        run: npm install

      - name: Generate build metadata
        run: npm run build:version

      - name: Build runtime worker
        run: npm run build-worker

      - name: Resolve Moodle source refs
        id: moodle_refs
        shell: bash
        run: |
          set -euo pipefail

          repo="https://github.com/moodle/moodle.git"
          heads=$(git ls-remote "$repo" \
            refs/heads/MOODLE_404_STABLE \
            refs/heads/MOODLE_405_STABLE \
            refs/heads/MOODLE_500_STABLE \
            refs/heads/MOODLE_501_STABLE \
            refs/heads/main)

          resolve_head() {
            local output_name="$1"
            local ref="$2"
            local sha

            sha=$(printf '%s\n' "$heads" | awk -v ref="$ref" '$2 == ref { print $1; exit }')
            if [ -z "$sha" ]; then
              echo "Unable to resolve Moodle ref: $ref" >&2
              exit 1
            fi

            printf '%s=%s\n' "$output_name" "$sha" >> "$GITHUB_OUTPUT"
            printf '%-20s %s\n' "$output_name" "$sha"
          }

          resolve_head moodle_404 refs/heads/MOODLE_404_STABLE
          resolve_head moodle_405 refs/heads/MOODLE_405_STABLE
          resolve_head moodle_500 refs/heads/MOODLE_500_STABLE
          resolve_head moodle_501 refs/heads/MOODLE_501_STABLE
          resolve_head main refs/heads/main

          tag_refs=$(git ls-remote "$repo" \
            refs/tags/v5.2.0 \
            'refs/tags/v5.2.0^{}')
          tag_sha=$(printf '%s\n' "$tag_refs" | awk '$2 ~ /\^\{\}$/ { print $1; exit }')
          if [ -z "$tag_sha" ]; then
            tag_sha=$(printf '%s\n' "$tag_refs" | awk 'NR == 1 { print $1 }')
          fi
          if [ -z "$tag_sha" ]; then
            echo "Unable to resolve Moodle tag: v5.2.0" >&2
            exit 1
          fi

          printf 'moodle_502=%s\n' "$tag_sha" >> "$GITHUB_OUTPUT"
          printf '%-20s %s\n' moodle_502 "$tag_sha"

      - name: Restore Moodle 4.4 bundle
        id: cache_404
        uses: actions/cache@v6
        with:
          path: |
            assets/moodle/MOODLE_404_STABLE
            assets/manifests/MOODLE_404_STABLE.json
          key: moodle-bundle-v1-php83-node24-404-${{ steps.moodle_refs.outputs.moodle_404 }}-${{ hashFiles('Makefile', 'package.json', 'package-lock.json', 'scripts/**', 'patches/**') }}

      - name: Restore Moodle 4.5 bundle
        id: cache_405
        uses: actions/cache@v6
        with:
          path: |
            assets/moodle/MOODLE_405_STABLE
            assets/manifests/MOODLE_405_STABLE.json
          key: moodle-bundle-v1-php83-node24-405-${{ steps.moodle_refs.outputs.moodle_405 }}-${{ hashFiles('Makefile', 'package.json', 'package-lock.json', 'scripts/**', 'patches/**') }}

      - name: Restore Moodle 5.0 bundle
        id: cache_500
        uses: actions/cache@v6
        with:
          path: |
            assets/moodle/MOODLE_500_STABLE
            assets/manifests/MOODLE_500_STABLE.json
          key: moodle-bundle-v1-php83-node24-500-${{ steps.moodle_refs.outputs.moodle_500 }}-${{ hashFiles('Makefile', 'package.json', 'package-lock.json', 'scripts/**', 'patches/**') }}

      - name: Restore Moodle 5.1 bundle
        id: cache_501
        uses: actions/cache@v6
        with:
          path: |
            assets/moodle/MOODLE_501_STABLE
            assets/manifests/MOODLE_501_STABLE.json
          key: moodle-bundle-v1-php83-node24-501-${{ steps.moodle_refs.outputs.moodle_501 }}-${{ hashFiles('Makefile', 'package.json', 'package-lock.json', 'scripts/**', 'patches/**') }}

      - name: Restore Moodle 5.2 bundle
        id: cache_502
        uses: actions/cache@v6
        with:
          path: |
            assets/moodle/MOODLE_502_STABLE
            assets/manifests/MOODLE_502_STABLE.json
          key: moodle-bundle-v1-php83-node24-502-${{ steps.moodle_refs.outputs.moodle_502 }}-${{ hashFiles('Makefile', 'package.json', 'package-lock.json', 'scripts/**', 'patches/**') }}

      - name: Restore Moodle main bundle
        id: cache_main
        uses: actions/cache@v6
        with:
          path: |
            assets/moodle/main
            assets/manifests/main.json
          key: moodle-bundle-v1-php83-node24-main-${{ steps.moodle_refs.outputs.main }}-${{ hashFiles('Makefile', 'package.json', 'package-lock.json', 'scripts/**', 'patches/**') }}

      - name: Restore snapshot cache
        if: ${{ steps.cache_404.outputs.cache-hit != 'true' || steps.cache_405.outputs.cache-hit != 'true' || steps.cache_500.outputs.cache-hit != 'true' || steps.cache_501.outputs.cache-hit != 'true' || steps.cache_502.outputs.cache-hit != 'true' || steps.cache_main.outputs.cache-hit != 'true' }}
        uses: actions/cache@v6
        with:
          path: .cache/snapshots
          key: snapshots-${{ hashFiles('patches/**', 'scripts/generate-install-snapshot.sh', 'scripts/patch-moodle-source.sh', 'scripts/generate-component-cache.php') }}
          restore-keys: |
            snapshots-

      - name: Build missing Moodle bundles
        if: ${{ steps.cache_404.outputs.cache-hit != 'true' || steps.cache_405.outputs.cache-hit != 'true' || steps.cache_500.outputs.cache-hit != 'true' || steps.cache_501.outputs.cache-hit != 'true' || steps.cache_502.outputs.cache-hit != 'true' || steps.cache_main.outputs.cache-hit != 'true' }}
        shell: bash
        env:
          CACHE_404: ${{ steps.cache_404.outputs.cache-hit }}
          CACHE_405: ${{ steps.cache_405.outputs.cache-hit }}
          CACHE_500: ${{ steps.cache_500.outputs.cache-hit }}
          CACHE_501: ${{ steps.cache_501.outputs.cache-hit }}
          CACHE_502: ${{ steps.cache_502.outputs.cache-hit }}
          CACHE_MAIN: ${{ steps.cache_main.outputs.cache-hit }}
        run: |
          set -euo pipefail

          targets=()
          [ "$CACHE_404" = "true" ] || targets+=(bundle-MOODLE_404_STABLE)
          [ "$CACHE_405" = "true" ] || targets+=(bundle-MOODLE_405_STABLE)
          [ "$CACHE_500" = "true" ] || targets+=(bundle-MOODLE_500_STABLE)
          [ "$CACHE_501" = "true" ] || targets+=(bundle-MOODLE_501_STABLE)
          [ "$CACHE_502" = "true" ] || targets+=(bundle-MOODLE_502_STABLE)
          [ "$CACHE_MAIN" = "true" ] || targets+=(bundle-main)

          printf 'Building %d uncached Moodle bundle(s): %s\n' "${#targets[@]}" "${targets[*]}"
          make check-php
          make --no-print-directory -j 2 "${targets[@]}"

      - name: Install docs dependencies
        run: python -m pip install --default-timeout=120 -r requirements-docs.txt

      - name: Assemble site artifact
        run: |
          rm -rf _site site
          mkdir -p _site/docs
          rsync -a ./ ./_site/ \
            --exclude ".git/" \
            --exclude ".github/" \
            --exclude ".venv/" \
            --exclude ".cache/" \
            --exclude "_site/" \
            --exclude "docs/" \
            --exclude "node_modules/" \
            --exclude "site/" \
            --exclude "tests/" \
            --exclude "patches/"
          zensical build --clean
          rsync -a --delete site/ _site/docs/
          rm -rf site
          touch _site/.nojekyll
          # Split oversized core bundles (>25 MiB) into parts so the site can be
          # served from Cloudflare Pages (25 MiB/file cap). The loader reassembles
          # them; e2e below serves this same _site, exercising the chunked path.
          node scripts/chunk-bundles.mjs _site

      - name: Upload site artifact
        uses: actions/upload-artifact@v7
        with:
          name: site-build
          path: _site/
          retention-days: 1

      - name: Upload Pages artifact
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      # ── Cloudflare Pages preview (same-repo PRs) ──
      - name: Deploy to Cloudflare Pages (PR preview)
        id: cf_preview
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          out=$(npx --yes wrangler@4 pages deploy _site \
            --project-name="$CLOUDFLARE_PAGES_PROJECT" \
            --branch="$HEAD_REF" --commit-dirty=true 2>&1 | tee /dev/stderr)
          proj="$CLOUDFLARE_PAGES_PROJECT"
          urls=$(printf '%s\n' "$out" | grep -oE "https://[a-z0-9-]+\.${proj}\.pages\.dev" | sort -u)
          deploy_url=$(printf '%s\n' "$urls" | grep -E "https://[0-9a-f]{8}\.${proj}\." | head -n1)
          alias_url=$(printf '%s\n' "$urls" | grep -vE "https://[0-9a-f]{8}\.${proj}\." | head -n1)
          { echo "deploy_url=$deploy_url"; echo "alias_url=$alias_url"; } >> "$GITHUB_OUTPUT"

      - name: Comment preview URL on PR
        if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.head_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          DEPLOY_URL: ${{ steps.cf_preview.outputs.deploy_url }}
          ALIAS_URL: ${{ steps.cf_preview.outputs.alias_url }}
        run: |
          MARKER='<!-- cf-preview -->'
          LOGO='https://user-images.githubusercontent.com/23264/106598434-9e719e00-654f-11eb-9e59-6167043cfa01.png'
          SHA7=$(printf '%s' "$HEAD_SHA" | cut -c1-7)
          ALIAS="$ALIAS_URL"
          if [ -z "$ALIAS" ]; then
            slug=$(printf '%s' "$HEAD_REF" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g; s/^-+//; s/-+$//' | cut -c1-28 | sed -E 's/-+$//')
            ALIAS="https://${slug}.${CLOUDFLARE_PAGES_PROJECT}.pages.dev"
          fi
          DEPLOY="${DEPLOY_URL:-$ALIAS}"
          if [ -n "$DEPLOY_URL" ] || [ -n "$ALIAS_URL" ]; then
            BODY=$(printf '%s\n## Deploying %s with &nbsp;<img alt="Cloudflare Pages" src="%s" width="16">&nbsp; Cloudflare Pages\n\n<a href="%s" target="_blank" rel="noopener noreferrer"><img src="%s" alt="Try on the Playground" height="51"></a>\n\n|  |  |\n| :-- | :-- |\n| **Latest commit** | `%s` |\n| **Preview URL (branch)** | %s |\n| **Deployment URL (commit)** | %s |' \
              "$MARKER" "$CLOUDFLARE_PAGES_PROJECT" "$LOGO" "$ALIAS" "$PREVIEW_BUTTON_IMG" "$SHA7" "$ALIAS" "$DEPLOY")
          else
            BODY=$(printf '%s\n## Deploying %s with Cloudflare Pages\n\n⚠️ Preview deploy failed — see the workflow logs.\n\nBranch `%s`' \
              "$MARKER" "$CLOUDFLARE_PAGES_PROJECT" "$HEAD_REF")
          fi
          CID=$(gh api "repos/$REPO/issues/$PR_NUMBER/comments" \
            --jq "map(select(.body|startswith(\"$MARKER\")))|.[0].id // empty")
          if [ -n "$CID" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$CID" -f body="$BODY" >/dev/null
          else
            gh api -X POST "repos/$REPO/issues/$PR_NUMBER/comments" -f body="$BODY" >/dev/null
          fi

  # ── E2E: Chromium + Firefox, shard only the Firefox critical path ──
  e2e:
    name: e2e (${{ matrix.label }})
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: chromium
            label: chromium
            shard_arg: ""
            artifact: chromium
            workers: 2
          - browser: firefox
            label: firefox, shard 1/2
            shard_arg: --shard=1/2
            artifact: firefox-1-of-2
            workers: 2
          - browser: firefox
            label: firefox, shard 2/2
            shard_arg: --shard=2/2
            artifact: firefox-2-of-2
            workers: 2
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Install Playwright ${{ matrix.browser }}
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Download site artifact
        uses: actions/download-artifact@v8
        with:
          name: site-build
          path: _site

      - name: Run Playwright e2e tests (${{ matrix.label }})
        run: npx playwright test --project=${{ matrix.browser }} ${{ matrix.shard_arg }}
        env:
          CI: "true"
          PLAYWRIGHT_WEB_ROOT: _site
          PLAYWRIGHT_EXTERNAL_SERVER: "0"
          PLAYWRIGHT_WORKERS: ${{ matrix.workers }}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-results-${{ matrix.artifact }}
          path: test-results/
          retention-days: 7

  # ── Deploy to GitHub Pages (push to main, or scheduled/manual rebuild) ──
  deploy-pages:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: [lint-and-test, build, e2e]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  # ── Deploy to Cloudflare Pages (production; push to main or scheduled/manual rebuild; gated on e2e) ──
  deploy-cloudflare:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: [lint-and-test, build, e2e]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Download site artifact
        uses: actions/download-artifact@v8
        with:
          name: site-build
          path: _site

      - name: Deploy to Cloudflare Pages (production)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --yes wrangler@4 pages deploy _site --project-name="$CLOUDFLARE_PAGES_PROJECT" --branch=main --commit-dirty=true
