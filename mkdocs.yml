site_name: Moodle Playground
site_description: Moodle running entirely in your browser via WebAssembly — contributor and user documentation.
site_url: https://ateeducacion.github.io/moodle-playground/docs/
repo_url: https://github.com/ateeducacion/moodle-playground
repo_name: ateeducacion/moodle-playground
edit_uri: edit/main/docs/
docs_dir: docs
site_dir: site

theme:
  name: material
  language: en
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.instant
    - navigation.tracking
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.action.edit
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github
    logo: material/school

extra_css:
  - stylesheets/extra.css

nav:
  - Home: index.md
  - Getting started:
      - Quick start: getting-started.md
      - Run it locally: local-development.md
  - Using Moodle Playground:
      - Basic usage: usage.md
      - URL parameters: url-parameters.md
      - Browser userscripts: browser-userscripts.md
  - Blueprints:
      - Overview: blueprints/index.md
      - Examples: blueprints/examples.md
      - Reference: blueprints/reference.md
      - Runtime and versions: blueprints/runtime.md
  - GitHub integration:
      - PR previews: github/pr-previews.md
      - Action reference: github/action-reference.md
  - Architecture:
      - Overview: architecture.md
  - Maintainers:
      - Contributing: maintainers/contributing.md
      - Internal notes: maintainers/internal-notes.md

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.caret
  - pymdownx.tilde

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/ateeducacion/moodle-playground
    - icon: fontawesome/solid/globe
      link: https://moodle-playground.com
